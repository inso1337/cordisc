name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run
      - name: CLI smoke test (expected to find fixture errors)
        run: |
          set +e
          node dist/cli.js check -p fixtures/app/tsconfig.json --no-color
          [ $? -eq 1 ] || exit 1
          node dist/cli.js check -p fixtures/clean/tsconfig.json --no-color || exit 1
          node dist/cli.js gen -p fixtures/gen/tsconfig.json || exit 1
          node dist/cli.js build -p fixtures/build/tsconfig.json -o /tmp/cordisc-build || exit 1
